services:
  postgres:
    image: postgres:16-alpine
    container_name: tavern-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "tavern"
      POSTGRES_USER: "tavern"
      POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_DB_PASSWORD"
    volumes:
      - tavern_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tavern -d tavern"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  tavern:
    image: ghcr.io/hans-hans-hans/tavern:latest
    container_name: tavern
    restart: unless-stopped
    command: ["uvicorn", "server.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "/app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg2://tavern:REPLACE_WITH_STRONG_DB_PASSWORD@postgres:5432/tavern"
      SECRET_KEY: "REPLACE_WITH_LONG_RANDOM_SECRET"
      PERSISTENT_LOGIN_EXPIRE_DAYS: "3650"
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "none"
      CORS_ORIGINS: "https://your-domain.example.com"
      VAPID_PUBLIC_KEY: "REPLACE_WITH_VAPID_PUBLIC_KEY"
      VAPID_PRIVATE_KEY: "REPLACE_WITH_VAPID_PRIVATE_KEY"
      VAPID_SUBJECT: "https://your-domain.example.com"
      APP_VERSION: "1.0.0"
    ports:
      - "8000:8000"
    volumes:
      - tavern_db:/data
      - tavern_uploads:/app/server/uploads
      - tavern_logs:/app/server/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  tavern_postgres_data:
  tavern_db:
  tavern_uploads:
  tavern_logs:
