[package]
name = "tavern_desktop_client"
version = "0.1.0"
description = "Tavern desktop client wrapper"
authors = ["Tavern"]
edition = "2021"

[package.metadata]

[lib]
name = "tavern_desktop_client_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-ico"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
