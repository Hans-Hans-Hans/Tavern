<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tavern Client Connect</title>
  <style>
    :root {
      --bg: #101317;
      --panel: #1a2028;
      --panel-2: #222a34;
      --text: #ecf2fa;
      --muted: #9fb0c6;
      --accent: #5f8fcf;
      --accent-2: #8fb7ec;
      --border: rgba(255,255,255,0.12);
      --danger: #b95a5a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(95,143,207,0.18), transparent 60%),
        radial-gradient(900px 500px at 110% 110%, rgba(143,183,236,0.12), transparent 55%),
        var(--bg);
      color: var(--text);
      font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
      padding: 20px;
    }
    .card {
      width: min(640px, 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      padding: 18px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .sub {
      margin: 0 0 14px;
      color: var(--muted);
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 10px;
    }
    input[type="text"] {
      width: 100%;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 0 12px;
      font-size: 14px;
    }
    button {
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 0 14px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
    }
    button.primary {
      background: linear-gradient(180deg, var(--accent), #4e7bb8);
      border-color: rgba(95,143,207,0.45);
    }
    button.secondary {
      background: rgba(255,255,255,0.06);
      color: var(--muted);
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .hint, .saved {
      color: var(--muted);
      margin-top: 8px;
      font-size: 12px;
    }
    .error {
      margin-top: 8px;
      color: #ffb1b1;
      background: rgba(185,90,90,0.14);
      border: 1px solid rgba(185,90,90,0.35);
      border-radius: 10px;
      padding: 8px 10px;
      display: none;
    }
    .saved code, .hint code {
      color: var(--accent-2);
      font-family: Consolas, monospace;
    }
    @media (max-width: 560px) {
      .row { grid-template-columns: 1fr; }
      button { width: 100%; }
      .actions button { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Tavern Desktop Client</h1>
    <p class="sub">Enter the Tavern server URL you want this desktop app to connect to.</p>
    <div class="row">
      <input id="server-url-input" type="text" placeholder="https://example.com or http://192.168.1.50:8000" autocomplete="url" spellcheck="false">
      <button id="connect-btn" class="primary" type="button">Connect</button>
    </div>
    <div class="actions">
      <button id="open-saved-btn" type="button">Open Saved Server</button>
      <button id="clear-saved-btn" type="button" class="secondary">Clear Saved Server</button>
      <button id="open-web-login-btn" type="button" class="secondary">Open Login</button>
    </div>
    <div id="saved-line" class="saved" hidden></div>
    <div class="hint">
      This page saves your server URL locally using <code>localStorage["tavern.desktopServerUrl"]</code>.
    </div>
    <div id="error-box" class="error"></div>
  </main>
  <script src="src/desktop-connect.js?v=20260223-desktopconnect2"></script>
</body>
</html>
