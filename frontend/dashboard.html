<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tavern Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo">Tavern 🍺</div>
      <div class="header-buttons">
        <button id="logout-button" class="secondary">Logout</button>
        <a href="https://github.com/Hans-Hans-Hans/Tavern.git" target="_blank" class="github-link">GitHub</a>
      </div>
    </div>
  </header>

  <main class="dashboard-main">
    <!-- Sidebar: Taverns -->
    <aside class="sidebar">
      <h2>Your Taverns</h2>
      <ul id="tavern-list" class="clickable-list"></ul>
      <input type="text" id="new-tavern-name" placeholder="New Tavern Name">
      <button id="create-tavern">Add Tavern</button>
    </aside>

    <!-- Channels Panel -->
    <div class="channels-panel">
      <div class="channels-header" id="channel-header">Select a tavern to see channels</div>
      <ul id="channel-list" class="clickable-list"></ul>
    </div>

    <!-- Chat Panel -->
    <div class="chat-panel">
      <ul id="messages"></ul>
      <div class="chat-input">
        <input type="text" id="message-input" placeholder="Type a message...">
        <button id="send-message">Send</button>
      </div>
    </div>
  </main>

  <footer>© 2026 Tavern</footer>

  <!-- JS -->
  <script src="js/app.js"></script>
  <script src="js/dashboard.js" defer></script>
</body>
</html>
