<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Tavern</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo">Tavern 🍺</div>
      <a href="https://github.com/Hans-Hans-Hans/Tavern.git" target="_blank" class="github-link">GitHub</a>
    </div>
  </header>

  <main class="page-container">
    <div class="hero-title-wrapper">
      <svg class="hero-crest" viewBox="0 0 512 512" fill="none" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
        <path d="M256 40 L420 120 V260 C420 350 340 430 256 470 C172 430 92 350 92 260 V120 Z"/>
        <line x1="256" y1="120" x2="256" y2="370"/>
        <line x1="220" y1="160" x2="292" y2="160"/>
      </svg>
      <h1>Welcome, Traveler</h1>
    </div>

    <form id="registerForm">
        <label>Username</label>
        <input type="text" id="regUsername" required />

        <label>Password</label>
        <input type="password" id="regPassword" required />

        <label>Confirm Password</label>
        <input type="password" id="regConfirm" required />

        <button type="submit">Register</button>
        <div id="registerMessage"></div>
    </form>

    <p class="form-link">
      Already have an account? <a href="login.html">Login here</a>
    </p>
  </main>

  <footer>
    © 2026 Tavern
  </footer>

  <script src="js/app.js" defer></script>
</body>
</html>
